<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="description" content="Sistema de gestión para barberías: agenda de empleados, caja con comisiones automáticas, inventario y reportes exportables a Excel." />
    <title>BarberOS — Gestión de Barbería</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div style="font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0b0b0f; color: #f5f5f7; padding: 20px;">
        <div style="max-width: 500px; text-align: center; background: #16161f; padding: 32px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
          <div style="font-size: 44px; margin-bottom: 16px;">💈</div>
          <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 10px; color: #f5f5f7;">Iniciando BarberOS...</h2>
          <p style="color: #a1a1aa; font-size: 14px; line-height: 1.6; margin-bottom: 24px;">
            Las aplicaciones de React y Vite deben ejecutarse con <code>npm run dev</code> en lugar de Live Server. El sistema ya está activo en:
          </p>
          <a href="http://localhost:5173" style="display: inline-block; background: #d97706; color: #fff; text-decoration: none; font-weight: 600; padding: 12px 24px; border-radius: 8px; font-size: 15px;">
            Ir a la Aplicación (http://localhost:5173)
          </a>
        </div>
      </div>
    </div>
    <script>
      // Si el usuario abrió accidentalmente desde Live Server (puerto 5500) o file://
      if (window.location.port === '5500' || window.location.protocol === 'file:') {
        window.location.href = 'http://localhost:5173' + window.location.search;
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
